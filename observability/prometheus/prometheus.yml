global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: techchallenge-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - core-service:8080
          - os-service:8080
          - execution-service:8080
          - billing-service:8080

  - job_name: techchallenge-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://core-service:8080/health/ready
          - http://os-service:8080/api/v1/ordens-servico/health
          - http://execution-service:8080/health/ready
          - http://billing-service:8080/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

