name: techchallenge-ecosystem

services:
  floci:
    image: floci/floci:latest
    container_name: techchallenge-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_LOG_LEVEL: info
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_ENABLED: "true"
      DEFAULT_REGION: sa-east-1
      AWS_DEFAULT_REGION: sa-east-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./floci/init/ready.d:/etc/floci/init/ready.d:ro
      - floci_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  floci-ui:
    image: floci/floci-ui:latest
    container_name: techchallenge-floci-ui
    ports:
      - "4500:4500"
    environment:
      API_TARGET: http://floci:4566
      FLOCI_ENDPOINT: http://floci:4566
    depends_on:
      floci:
        condition: service_healthy
    restart: unless-stopped

  core-db:
    image: postgres:16-alpine
    container_name: techchallenge-core-db
    environment:
      POSTGRES_DB: techchallenge_core_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techchallenge_core_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  execution-db:
    image: postgres:16-alpine
    container_name: techchallenge-execution-db
    environment:
      POSTGRES_DB: techchallenge_execution_db
      POSTGRES_USER: execution
      POSTGRES_PASSWORD: execution_local_pwd
    ports:
      - "5433:5432"
    volumes:
      - execution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execution -d techchallenge_execution_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  billing-db:
    image: postgres:16-alpine
    container_name: techchallenge-billing-db
    environment:
      POSTGRES_DB: techchallenge_billing_db
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing_password
    ports:
      - "5434:5432"
    volumes:
      - billing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d techchallenge_billing_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  core-service:
    build:
      context: ../fase1-tech-challenge
      dockerfile: Dockerfile
      additional_contexts:
        shared: .
    container_name: techchallenge-core-service
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: "techchallenge-core-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      ConnectionStrings__DefaultConnection: "Host=core-db;Port=5432;Database=techchallenge_core_db;Username=postgres;Password=postgres_password"
      AWS_REGION: "sa-east-1"
      AWS_SERVICE_URL: "http://floci:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      JWT_SECRET: "techchallenge_jwt_secret_super_secure_key_1234567890!"
      Jwt__Secret: "techchallenge_jwt_secret_super_secure_key_1234567890!"
      Jwt__Issuer: "TechChallenge"
      Jwt__Audience: "techchallenge.com.br"
    depends_on:
      core-db:
        condition: service_healthy
      floci:
        condition: service_healthy
    restart: unless-stopped

  os-service:
    build:
      context: ../os-microservice
      dockerfile: Dockerfile
      additional_contexts:
        shared: .
    container_name: techchallenge-os-service
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: "techchallenge-os-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      AWS_REGION: "sa-east-1"
      AWS__Region: "sa-east-1"
      AWS_SERVICE_URL: "http://floci:4566"
      AWS__ServiceURL: "http://floci:4566"
      AWS_ENDPOINT_URL: "http://floci:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      TABLE_NAME: "techchallenge-ordem-servico-local"
      EVENTOS_TOPIC_ARN: "arn:aws:sns:sa-east-1:000000000000:techchallenge-eventos-local"
      COMPENSACAO_QUEUE_URL: "http://floci:4566/000000000000/techchallenge-ordem-servico-compensacao-local"
      OS_EVENTOS_QUEUE_URL: "http://floci:4566/000000000000/techchallenge-os-eventos-local"
      CORE_API_BASE_URL: "http://core-service:8080"
      JWT_SECRET: "techchallenge_jwt_secret_super_secure_key_1234567890!"
      JWT_ISSUER: "TechChallenge"
      JWT_AUDIENCE: "techchallenge.com.br"
    depends_on:
      floci:
        condition: service_healthy
      core-service:
        condition: service_started
    restart: unless-stopped

  execution-service:
    build:
      context: ../execution-service
      dockerfile: Dockerfile
      additional_contexts:
        shared: .
    container_name: techchallenge-execution-service
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: "techchallenge-execution-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      ConnectionStrings__ExecutionDb: "Host=execution-db;Port=5432;Database=techchallenge_execution_db;Username=execution;Password=execution_local_pwd"
      AWS_REGION: "sa-east-1"
      AWS_SERVICE_URL: "http://floci:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      EVENTOS_TOPIC_ARN: "arn:aws:sns:sa-east-1:000000000000:techchallenge-eventos-local"
      EXECUCAO_QUEUE_URL: "http://floci:4566/000000000000/techchallenge-execucao-eventos-local"
      JWT_SECRET: "techchallenge_jwt_secret_super_secure_key_1234567890!"
      Jwt__Secret: "techchallenge_jwt_secret_super_secure_key_1234567890!"
      Jwt__Issuer: "TechChallenge"
      Jwt__Audience: "techchallenge.com.br"
    depends_on:
      execution-db:
        condition: service_healthy
      floci:
        condition: service_healthy
    restart: unless-stopped

  billing-service:
    build:
      context: ../billing-service
      dockerfile: Dockerfile
      additional_contexts:
        shared: .
    container_name: techchallenge-billing-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: "techchallenge-billing-service"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      ConnectionStrings__DefaultConnection: "Host=billing-db;Port=5432;Database=techchallenge_billing_db;Username=billing;Password=billing_password"
      AWS_REGION: "sa-east-1"
      AWS__Region: "sa-east-1"
      AWS_SERVICE_URL: "http://floci:4566"
      AWS__ServiceURL: "http://floci:4566"
      AWS_ENDPOINT_URL: "http://floci:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      EVENTOS_TOPIC_ARN: "arn:aws:sns:sa-east-1:000000000000:techchallenge-eventos-local"
      BILLING_QUEUE_URL: "http://floci:4566/000000000000/techchallenge-billing-eventos-local"
      MercadoPago__AccessToken: "mock"
      JWT_SECRET: "techchallenge_jwt_secret_super_secure_key_1234567890!"
      Jwt__Secret: "techchallenge_jwt_secret_super_secure_key_1234567890!"
      Jwt__Issuer: "TechChallenge"
      Jwt__Audience: "techchallenge.com.br"
    depends_on:
      billing-db:
        condition: service_healthy
      floci:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Stack de Observabilidade (Prometheus, Blackbox, Alertmanager, Loki, Tempo, OTel, Grafana)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: techchallenge-prometheus
    restart: unless-stopped
    depends_on:
      - core-service
      - os-service
      - execution-service
      - billing-service
      - blackbox-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../fase1-tech-challenge/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: techchallenge-blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ../fase1-tech-challenge/observability/blackbox/blackbox.yml:/config/blackbox.yml:ro
    command:
      - --config.file=/config/blackbox.yml

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: techchallenge-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ../fase1-tech-challenge/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      - alert-receiver
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  alert-receiver:
    image: python:3.12-alpine
    container_name: techchallenge-alert-receiver
    restart: unless-stopped
    ports:
      - "9094:8080"
    volumes:
      - ../fase1-tech-challenge/observability/alertmanager/receiver.py:/app/receiver.py:ro
    command: ["python", "/app/receiver.py"]

  loki:
    image: grafana/loki:3.1.0
    container_name: techchallenge-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ../fase1-tech-challenge/observability/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  tempo:
    image: grafana/tempo:2.5.0
    container_name: techchallenge-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../fase1-tech-challenge/observability/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: techchallenge-otel-collector
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
    ports:
      - "4319:4317"
      - "4320:4318"
    volumes:
      - ../fase1-tech-challenge/observability/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: techchallenge-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../fase1-tech-challenge/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../fase1-tech-challenge/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../fase1-tech-challenge/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  floci_data:
  core_db_data:
  execution_db_data:
  billing_db_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  tempo_data:
